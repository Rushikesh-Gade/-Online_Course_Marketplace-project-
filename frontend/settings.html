<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - LearnHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="dashboard-student.html"><i class="fas fa-graduation-cap"></i><span>Learn<span class="highlight">Hub</span></span></a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard-student.html" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
            <a href="my-courses.html" class="nav-item"><i class="fas fa-book-open"></i> My Courses</a>
            <a href="wishlist.html" class="nav-item"><i class="fas fa-heart"></i> Wishlist</a>
            <a href="certificates.html" class="nav-item"><i class="fas fa-certificate"></i> Certificates</a>
            <a href="study-room.html" class="nav-item"><i class="fas fa-users"></i> Study Rooms</a>
            <a href="notifications.html" class="nav-item"><i class="fas fa-bell"></i> Notifications</a>
            <a href="settings.html" class="nav-item active"><i class="fas fa-gear"></i> Settings</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</a>
        </div>
    </aside>
    <div class="dashboard-main">
        <header class="dash-topbar">
            <div class="topbar-left"><h1>Account Settings</h1></div>
            <div class="topbar-right">
                <div class="topbar-avatar"><i class="fas fa-user"></i><span id="userName">Student</span></div>
            </div>
        </header>
        <div style="padding:24px 32px;max-width:700px;">
            <section class="dash-section" style="margin-bottom:24px;">
                <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);">Profile Information</h2>
                <form id="profileForm" style="display:flex;flex-direction:column;gap:18px;">
                    <div class="form-row">
                        <div class="form-group">
                            <label>First Name</label>
                            <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="firstName" placeholder="First name"></div>
                        </div>
                        <div class="form-group">
                            <label>Last Name</label>
                            <div class="input-wrapper"><i class="fas fa-user"></i><input type="text" id="lastName" placeholder="Last name"></div>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="Email" readonly style="opacity:0.6;cursor:not-allowed;"></div>
                    </div>
                    <div class="form-group">
                        <label>Bio</label>
                        <textarea id="bio" placeholder="Tell us about yourself..." style="width:100%;padding:13px 16px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;color:var(--text-primary);font-size:0.95rem;outline:none;resize:vertical;font-family:inherit;" rows="3"></textarea>
                    </div>
                    <button type="submit" class="btn-primary" style="width:fit-content;"><i class="fas fa-save"></i> Save Changes</button>
                </form>
            </section>
            <section class="dash-section">
                <h2 style="font-size:1.1rem;font-weight:700;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border);">Danger Zone</h2>
                <button class="btn-outline" style="border-color:#ef4444;color:#ef4444;" onclick="if(confirm('Are you sure you want to logout?')) logout();"><i class="fas fa-right-from-bracket"></i> Logout from all devices</button>
            </section>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = 'login.html';
        const u = getUser();
        if (u) {
            document.getElementById('userName').textContent = u.first_name;
            document.getElementById('firstName').value = u.first_name || '';
            document.getElementById('lastName').value = u.last_name || '';
            document.getElementById('email').value = u.email || '';
        }
        document.getElementById('logoutBtn').addEventListener('click', function(e) { e.preventDefault(); logout(); });
        document.getElementById('profileForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const data = await apiCall('/users/profile', 'PUT', {
                first_name: document.getElementById('firstName').value,
                last_name: document.getElementById('lastName').value,
                bio: document.getElementById('bio').value
            });
            alert(data.success ? 'Profile updated successfully!' : data.message);
        });
    </script>
</body>
</html>
