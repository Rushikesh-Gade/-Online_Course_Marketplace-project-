<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses - LearnHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body class="dashboard-body">
    <aside class="sidebar">
        <div class="sidebar-logo">
            <a href="dashboard-student.html"><i class="fas fa-graduation-cap"></i><span>Learn<span class="highlight">Hub</span></span></a>
        </div>
        <nav class="sidebar-nav">
            <a href="dashboard-student.html" class="nav-item"><i class="fas fa-home"></i> Dashboard</a>
            <a href="my-courses.html" class="nav-item active"><i class="fas fa-book-open"></i> My Courses</a>
            <a href="wishlist.html" class="nav-item"><i class="fas fa-heart"></i> Wishlist</a>
            <a href="certificates.html" class="nav-item"><i class="fas fa-certificate"></i> Certificates</a>
            <a href="study-room.html" class="nav-item"><i class="fas fa-users"></i> Study Rooms</a>
            <a href="notifications.html" class="nav-item"><i class="fas fa-bell"></i> Notifications</a>
            <a href="settings.html" class="nav-item"><i class="fas fa-gear"></i> Settings</a>
        </nav>
        <div class="sidebar-footer">
            <a href="#" class="nav-item" id="logoutBtn"><i class="fas fa-right-from-bracket"></i> Logout</a>
        </div>
    </aside>
    <div class="dashboard-main">
        <header class="dash-topbar">
            <div class="topbar-left"><h1>My Courses</h1></div>
            <div class="topbar-right">
                <div class="topbar-avatar"><i class="fas fa-user"></i><span id="userName">Student</span></div>
            </div>
        </header>
        <div style="padding:24px 32px;">
            <div class="welcome-banner" style="margin-bottom:24px;">
                <div><h2>Your <span class="highlight">Enrolled Courses</span></h2><p>Continue learning where you left off</p></div>
                <a href="courses.html" class="btn-primary"><i class="fas fa-plus"></i> Browse More Courses</a>
            </div>
            <div id="coursesContainer" class="progress-courses">
                <div style="text-align:center;padding:40px;color:var(--text-muted);"><i class="fas fa-spinner fa-spin" style="font-size:2rem;"></i></div>
            </div>
        </div>
    </div>
    <script src="js/api.js"></script>
    <script>
        if (!isLoggedIn()) window.location.href = 'login.html';
        const u = getUser();
        if (u) document.getElementById('userName').textContent = u.first_name;
        document.getElementById('logoutBtn').addEventListener('click', function(e) { e.preventDefault(); logout(); });

        async function loadMyCourses() {
            const data = await apiCall('/enrollments/my-courses');
            const container = document.getElementById('coursesContainer');
            if (data.success && data.enrollments.length > 0) {
                container.innerHTML = '';
                data.enrollments.forEach(e => {
                    container.innerHTML += `
                        <div class="progress-card">
                            <div class="progress-thumb"><i class="fas fa-book-open"></i></div>
                            <div class="progress-info">
                                <h3>${e.title}</h3>
                                <p><i class="fas fa-user"></i> ${e.first_name} ${e.last_name}</p>
                                <div class="progress-bar-wrap"><div class="progress-bar-fill" style="width:${e.progress_percent||0}%"></div></div>
                                <div class="progress-meta"><span>${e.progress_percent||0}% complete</span></div>
                                <a href="learn.html" class="btn-primary btn-sm">Continue <i class="fas fa-play"></i></a>
                            </div>
                        </div>`;
                });
            } else {
                container.innerHTML = '<div style="text-align:center;padding:60px;color:var(--text-muted);"><i class="fas fa-book-open" style="font-size:3rem;margin-bottom:16px;display:block;"></i><p>You have no enrolled courses yet.</p><a href="courses.html" class="btn-primary" style="margin-top:16px;display:inline-block;">Browse Courses</a></div>';
            }
        }
        loadMyCourses();
    </script>
</body>
</html>
